<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion — World Crypto Lottery</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/style.css">
</head>
<body>
    <header class="site-header">
        <a href="index.php" class="logo"><span class="logo-coin">₿</span> World<span class="accent">Crypto</span>Lottery</a>
        <nav class="nav">
            <a href="inscription.php" class="btn btn-gold">Créer un compte</a>
        </nav>
    </header>

    <main class="auth-wrap">
        <div class="card auth-card">
            <h1>🔐 Connexion</h1>
            <p class="subtitle">Accédez à votre compte et à votre tableau de bord</p>

            <div class="recap" id="recap-grilles"></div>

            <form id="login-form" action="process_login.php" method="POST">
                <input type="hidden" name="grilles_json" id="grilles_json" value="">
                <input type="hidden" name="montant_btc" id="montant_btc" value="0">

                <div class="field">
                    <label for="email">Adresse email</label>
                    <input type="email" id="email" name="email" placeholder="vous@exemple.com" required autocomplete="email">
                </div>
                <div class="field">
                    <label for="password">Mot de passe</label>
                    <input type="password" id="password" name="password" required autocomplete="current-password">
                </div>

                <button type="submit" class="btn btn-gold btn-block btn-lg">Se connecter</button>
            </form>

            <div class="auth-links">
                Pas encore de compte ? <a href="inscription.php">Créer un compte</a>
                <a href="index.php" class="retour">← Retour à la sélection de grilles</a>
            </div>
        </div>
    </main>

    <footer class="site-footer">
        <span class="age">18+</span> Jeu réservé aux personnes majeures. Jouez de manière responsable.
    </footer>

    <script>
        const recapDiv = document.getElementById('recap-grilles');
        const grillesInput = document.getElementById('grilles_json');
        const montantInput = document.getElementById('montant_btc');

        let grillesStockees = localStorage.getItem('grillesAValider');
        try { JSON.parse(grillesStockees || '[]'); } catch (e) { grillesStockees = null; }
        const montantStocke = localStorage.getItem('montantTotalBTC');

        if (grillesStockees && grillesStockees !== '[]' && montantStocke && parseFloat(montantStocke) > 0) {
            const grilles = JSON.parse(grillesStockees);
            const montant = parseFloat(montantStocke).toFixed(8);

            recapDiv.innerHTML = `
                Vous avez <strong>${grilles.length}</strong> grille(s) prête(s) à valider<br>
                Montant total à payer : <strong>${montant} BTC</strong>
            `;
            recapDiv.classList.add('visible');

            grillesInput.value = grillesStockees;
            montantInput.value = montant;

            document.querySelector('button[type="submit"]').textContent = 'Se connecter et valider mes grilles';
        } else {
            recapDiv.classList.remove('visible');
            document.querySelector('button[type="submit"]').textContent = 'Se connecter';
        }

        if (!grillesStockees || grillesStockees === '[]') {
            localStorage.removeItem('grillesAValider');
            localStorage.removeItem('montantTotalBTC');
        }
    </script>
</body>
</html>
